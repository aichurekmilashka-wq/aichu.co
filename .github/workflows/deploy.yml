
name: Publish React site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: aichu-github-ready
        run: npm install

      - name: Test application handling and funnel geometry
        working-directory: aichu-github-ready
        run: npm test

      - name: Build React
        working-directory: aichu-github-ready
        env:
          SITE_ORIGIN: https://aichuuu.com
          VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_WEB3FORMS_ACCESS_KEY: ${{ vars.VITE_WEB3FORMS_ACCESS_KEY }}
          VITE_YANDEX_METRIKA_ID: "114175679"
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: npm run build

      - name: Generate high-quality social preview
        working-directory: aichu-github-ready
        run: python3 scripts/render-og-preview.py

      - name: Verify localized pages and translations
        working-directory: aichu-github-ready
        env:
          SITE_ORIGIN: https://aichuuu.com
        run: node scripts/check-locales.mjs

      - name: Audit production dependencies
        working-directory: aichu-github-ready
        run: npm audit --omit=dev --audit-level=high

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: aichu-github-ready/dist

  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
