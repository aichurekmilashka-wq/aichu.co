name: Browser regression checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aichu-github-ready
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run security:check
      - name: Verify localized pages
        run: node scripts/check-locales.mjs
      - name: Validate Pages artifact upload without deploying
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: aichu-github-ready/dist
      - name: Build form for intercepted delivery tests
        run: npx --no-install vite build --outDir dist-connected
      - name: Install browser test tooling
        run: npx --no-install playwright install --with-deps chromium
      - name: Check responsive layouts and form behavior
        run: |
          npx --no-install vite preview --host 127.0.0.1 --port 4173 > /tmp/aichu-preview.log 2>&1 &
          npx --no-install vite preview --outDir dist-connected --host 127.0.0.1 --port 4174 > /tmp/aichu-connected.log 2>&1 &
          node scripts/browser-checks.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-checks
          path: aichu-github-ready/browser-results/
          retention-days: 14
